[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finflow"
version = "0.1.0"
description = "Multi-Agent Financial Document Ingestion, Reconciliation, and Compliance Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "litellm>=1.30.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "minio>=7.2.5",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "cryptography>=42.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cov -p no:langsmith -W ignore::DeprecationWarning"


